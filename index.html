
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Battle Royale 3D</title>

<link rel="stylesheet" href="style.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
}

.top {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    font-size: 14px;
    text-shadow: 1px 2px 4px black;
}

.status {
    background: #0009;
    padding: 9px 14px;
    border-radius: 8px;
}

#health {
    position: absolute;
    top: 65px;
    left: 15px;
    width: 145px;
    height: 12px;
    background: #555;
    border-radius: 10px;
    overflow: hidden;
}

#healthFill {
    width: 100%;
    height: 100%;
    background: #22df65;
}

#controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#joystick {
    position: absolute;
    left: 35px;
    bottom: 45px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #ffffff25;
    border: 2px solid #ffffff70;
    pointer-events: auto;
    touch-action: none;
}

#stick {
    position: absolute;
    width: 52px;
    height: 52px;
    left: 34px;
    top: 34px;
    border-radius: 50%;
    background: #ffffffaa;
    border: 2px solid white;
}

.action {
    position: absolute;
    pointer-events: auto;
    border: 2px solid #ffffffaa;
    color: white;
    background: #111a;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    touch-action: none;
    user-select: none;
}

#fire {
    right: 35px;
    bottom: 55px;
    width: 85px;
    height: 85px;
    background: #d52b22bb;
    font-size: 17px;
}

#jump {
    right: 135px;
    bottom: 65px;
    width: 58px;
    height: 58px;
}

#sprint {
    right: 120px;
    bottom: 140px;
    width: 55px;
    height: 55px;
    font-size: 11px;
}

#aim {
    right: 35px;
    bottom: 155px;
    width: 55px;
    height: 55px;
    font-size: 12px;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    font-size: 25px;
    color: white;
    text-shadow: 0 0 4px black;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
}

#startScreen h1 {
    font-size: 32px;
    margin-bottom: 12px;
    color: #ffca28;
}

#startScreen button {
    padding: 15px 40px;
    margin-top: 25px;
    background: #e94325;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
}

#message {
    position: absolute;
    top: 43%;
    width: 100%;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div class="top">
        <div class="status">BATTLE ROYALE</div>
        <div class="status" id="players">ENEMIES: 5</div>
    </div>

    <div id="health">
        <div id="healthFill"></div>
    </div>

    <div id="crosshair">+</div>
    <div id="message"></div>
</div>

<div id="controls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div class="action" id="fire">FIRE</div>
    <div class="action" id="jump">JUMP</div>
    <div class="action" id="sprint">RUN</div>
    <div class="action" id="aim">AIM</div>

</div>

<div id="startScreen">
    <h1>BATTLE ROYALE 3D</h1>
    <p>Survive. Fight. Become Champion.</p>
    <button id="startButton">START GAME</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module" src="game.js"></script>

</body>
</html>
