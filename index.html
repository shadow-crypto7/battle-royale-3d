<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Battle Royale 3D</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-overlay">
    <div id="hud">
      <div class="hud-badge" id="level-display">Level: 1/5</div>
      <div class="hud-badge" id="hp-display">Player HP: 100</div>
      <div class="hud-badge" id="team-display">Blue: 4 | Red: 4</div>
    </div>
    <div id="crosshair"></div>
    <div id="touch-controls">
      <div id="move-zone">
        <div id="joystick-base">
          <div id="joystick-thumb"></div>
        </div>
      </div>
      <div id="look-zone">
        <div id="fire-btn">FIRE</div>
      </div>
    </div>
    <div id="status-modal">
      <h1 id="status-title">Wave Cleared!</h1>
      <p id="status-desc">Level 1 Complete</p>
      <button id="status-btn">Next Level</button>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
